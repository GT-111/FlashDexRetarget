# Explicit native producer task. The stock flashdexretarget config is unchanged.
defaults:
  - flashdexretarget
  - override envs: native
  - override eval: native
  - _self_

# The dataset manifest supplies the scene and recording binding.
# The operator declares tracking tolerances.
native_tracking_tolerances:
  root_position_error_m: ???
  root_rotation_error_rad: ???
  part_position_error_m: ???
  part_rotation_error_rad: ???
  joint_position_error_rad: ???
  joint_position_error_m: null  # Required only for assets with passive slide coordinates.
  command_position_error_rad: ???
  command_position_error_m: null  # Required only for selected slide commands.
