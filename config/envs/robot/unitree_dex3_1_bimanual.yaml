# @package _global_

# Native FREE-wrist producer configuration for unitree_dex3_1.
# Strict physical anatomy only; missing fingers/roles remain absent.
robot:
  entity_name: robot
  self_collision: true
  xml_path: ${robot.native_scene.scene_xml_path}
  body_names:
    fingers: [thumb, index, middle]
  joint_names:
    wrist_trans: []
    wrist_rot: []
    finger:
      - left_ctrl_hand_thumb_0_joint
      - left_ctrl_hand_thumb_1_joint
      - left_ctrl_hand_thumb_2_joint
      - left_ctrl_hand_middle_0_joint
      - left_ctrl_hand_middle_1_joint
      - left_ctrl_hand_index_0_joint
      - left_ctrl_hand_index_1_joint
      - right_ctrl_hand_thumb_0_joint
      - right_ctrl_hand_thumb_1_joint
      - right_ctrl_hand_thumb_2_joint
      - right_ctrl_hand_index_0_joint
      - right_ctrl_hand_index_1_joint
      - right_ctrl_hand_middle_0_joint
      - right_ctrl_hand_middle_1_joint
  site_names:
    tip:
      left: [left_hand_thumb_2_link, left_hand_index_1_link, left_hand_middle_1_link]
      right: [right_hand_thumb_2_link, right_hand_index_1_link, right_hand_middle_1_link]
    contact: ${robot.site_names.tip}
  contact_links:
    left: [left_hand_palm_link, left_hand_thumb_0_link, left_hand_thumb_1_link, left_hand_thumb_2_link, left_hand_middle_0_link, left_hand_middle_1_link, left_hand_index_0_link, left_hand_index_1_link]
    right: [right_hand_palm_link, right_hand_thumb_0_link, right_hand_thumb_1_link, right_hand_thumb_2_link, right_hand_middle_0_link, right_hand_middle_1_link, right_hand_index_0_link, right_hand_index_1_link]
  body_mapping:
    all:
      - [{left: left_hand_thumb_1_link, right: right_hand_thumb_1_link}, thumb_proximal]
      - [{left: left_hand_thumb_2_link, right: right_hand_thumb_2_link}, thumb_distal]
      - [{left: left_hand_index_0_link, right: right_hand_index_0_link}, index_proximal]
      - [{left: left_hand_index_1_link, right: right_hand_index_1_link}, index_intermediate]
      - [{left: left_hand_middle_0_link, right: right_hand_middle_0_link}, middle_proximal]
      - [{left: left_hand_middle_1_link, right: right_hand_middle_1_link}, middle_intermediate]
    level1: {}
    level2: {}

  native_scene:
    scene_xml_path: ${oc.env:FDR_NATIVE_SCENE_XML}
    hands:
      - side: left
        entity_name: hand_left
        root_body_name: left_hand_palm_link
        root_joint_name: left_floating_base_joint
        command_actuator_names:
          - left_ctrl_hand_thumb_0_joint
          - left_ctrl_hand_thumb_1_joint
          - left_ctrl_hand_thumb_2_joint
          - left_ctrl_hand_middle_0_joint
          - left_ctrl_hand_middle_1_joint
          - left_ctrl_hand_index_0_joint
          - left_ctrl_hand_index_1_joint
        root_control:
          position_stiffness: 400.0
          position_damping: 40.0
          rotation_stiffness: 400.0
          rotation_damping: 40.0
          force_limit_n: null
          torque_limit_nm: null
          gravity_compensation: 1.0
          gravity_world_m_per_s2: [0.0, 0.0, -9.81]
      - side: right
        entity_name: hand_right
        root_body_name: right_hand_palm_link
        root_joint_name: right_floating_base_joint
        command_actuator_names:
          - right_ctrl_hand_thumb_0_joint
          - right_ctrl_hand_thumb_1_joint
          - right_ctrl_hand_thumb_2_joint
          - right_ctrl_hand_index_0_joint
          - right_ctrl_hand_index_1_joint
          - right_ctrl_hand_middle_0_joint
          - right_ctrl_hand_middle_1_joint
        root_control: ${robot.native_scene.hands.0.root_control}
    objects:
      - entity_name: articulated_object
        root_body_name: object_0
        root_joint_name: object_0_free
        parts:
          - name: base
            body_name: object_0
            mesh_path: ${oc.env:FDR_NATIVE_BOX_BASE_MESH}
            body_from_mesh_position_m: [0.0, 0.0, 0.0]
            body_from_mesh_quat_wxyz: [1.0, 0.0, 0.0, 0.0]
            distance_sign: unsigned
          - name: lid
            body_name: object_0_articulated
            mesh_path: ${oc.env:FDR_NATIVE_BOX_LID_MESH}
            body_from_mesh_position_m: [0.0, 0.0, 0.0]
            body_from_mesh_quat_wxyz: [1.0, 0.0, 0.0, 0.0]
            distance_sign: unsigned
