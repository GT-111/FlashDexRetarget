# @package _global_

# Native FREE-wrist producer configuration for wuji_hand.
# Strict physical anatomy only; missing fingers/roles remain absent.
robot:
  entity_name: robot
  self_collision: true
  xml_path: ${robot.native_scene.scene_xml_path}
  body_names:
    fingers: [thumb, index, middle, ring, pinky]
  joint_names:
    wrist_trans: []
    wrist_rot: []
    finger:
      - left_finger1_joint1_actuator
      - left_finger1_joint2_actuator
      - left_finger1_joint3_actuator
      - left_finger1_joint4_actuator
      - left_finger2_joint1_actuator
      - left_finger2_joint2_actuator
      - left_finger2_joint3_actuator
      - left_finger2_joint4_actuator
      - left_finger3_joint1_actuator
      - left_finger3_joint2_actuator
      - left_finger3_joint3_actuator
      - left_finger3_joint4_actuator
      - left_finger4_joint1_actuator
      - left_finger4_joint2_actuator
      - left_finger4_joint3_actuator
      - left_finger4_joint4_actuator
      - left_finger5_joint1_actuator
      - left_finger5_joint2_actuator
      - left_finger5_joint3_actuator
      - left_finger5_joint4_actuator
      - right_finger1_joint1_actuator
      - right_finger1_joint2_actuator
      - right_finger1_joint3_actuator
      - right_finger1_joint4_actuator
      - right_finger2_joint1_actuator
      - right_finger2_joint2_actuator
      - right_finger2_joint3_actuator
      - right_finger2_joint4_actuator
      - right_finger3_joint1_actuator
      - right_finger3_joint2_actuator
      - right_finger3_joint3_actuator
      - right_finger3_joint4_actuator
      - right_finger4_joint1_actuator
      - right_finger4_joint2_actuator
      - right_finger4_joint3_actuator
      - right_finger4_joint4_actuator
      - right_finger5_joint1_actuator
      - right_finger5_joint2_actuator
      - right_finger5_joint3_actuator
      - right_finger5_joint4_actuator
  site_names:
    tip:
      left: [left_finger1_tip_link, left_finger2_tip_link, left_finger3_tip_link, left_finger4_tip_link, left_finger5_tip_link]
      right: [right_finger1_tip_link, right_finger2_tip_link, right_finger3_tip_link, right_finger4_tip_link, right_finger5_tip_link]
    contact: ${robot.site_names.tip}
  contact_links:
    left: [left_palm_link, left_finger1_link1, left_finger1_link2, left_finger1_link3, left_finger1_link4, left_finger2_link1, left_finger2_link2, left_finger2_link3, left_finger2_link4, left_finger3_link1, left_finger3_link2, left_finger3_link3, left_finger3_link4, left_finger4_link1, left_finger4_link2, left_finger4_link3, left_finger4_link4, left_finger5_link1, left_finger5_link2, left_finger5_link3, left_finger5_link4]
    right: [right_palm_link, right_finger1_link1, right_finger1_link2, right_finger1_link3, right_finger1_link4, right_finger2_link1, right_finger2_link2, right_finger2_link3, right_finger2_link4, right_finger3_link1, right_finger3_link2, right_finger3_link3, right_finger3_link4, right_finger4_link1, right_finger4_link2, right_finger4_link3, right_finger4_link4, right_finger5_link1, right_finger5_link2, right_finger5_link3, right_finger5_link4]
  body_mapping:
    all:
      - [{left: left_finger1_link3, right: right_finger1_link3}, thumb_proximal]
      - [{left: left_finger1_link4, right: right_finger1_link4}, thumb_distal]
      - [{left: left_finger2_link1, right: right_finger2_link1}, index_proximal]
      - [{left: left_finger2_link3, right: right_finger2_link3}, index_intermediate]
      - [{left: left_finger2_link4, right: right_finger2_link4}, index_distal]
      - [{left: left_finger3_link3, right: right_finger3_link3}, middle_intermediate]
      - [{left: left_finger3_link4, right: right_finger3_link4}, middle_distal]
      - [{left: left_finger4_link3, right: right_finger4_link3}, ring_intermediate]
      - [{left: left_finger4_link4, right: right_finger4_link4}, ring_distal]
      - [{left: left_finger5_link3, right: right_finger5_link3}, pinky_intermediate]
      - [{left: left_finger5_link4, right: right_finger5_link4}, pinky_distal]
    level1: {}
    level2: {}

  native_scene:
    scene_xml_path: ${oc.env:FDR_NATIVE_SCENE_XML}
    hands:
      - side: left
        entity_name: hand_left
        root_body_name: left_palm_link
        root_joint_name: left_tracking_wrist_free
        command_actuator_names:
          - left_finger1_joint1_actuator
          - left_finger1_joint2_actuator
          - left_finger1_joint3_actuator
          - left_finger1_joint4_actuator
          - left_finger2_joint1_actuator
          - left_finger2_joint2_actuator
          - left_finger2_joint3_actuator
          - left_finger2_joint4_actuator
          - left_finger3_joint1_actuator
          - left_finger3_joint2_actuator
          - left_finger3_joint3_actuator
          - left_finger3_joint4_actuator
          - left_finger4_joint1_actuator
          - left_finger4_joint2_actuator
          - left_finger4_joint3_actuator
          - left_finger4_joint4_actuator
          - left_finger5_joint1_actuator
          - left_finger5_joint2_actuator
          - left_finger5_joint3_actuator
          - left_finger5_joint4_actuator
        root_control:
          position_stiffness: 350.0
          position_damping: 35.0
          rotation_stiffness: 250.0
          rotation_damping: 25.0
          force_limit_n: null
          torque_limit_nm: null
          gravity_compensation: 1.0
          gravity_world_m_per_s2: [0.0, 0.0, -9.81]
      - side: right
        entity_name: hand_right
        root_body_name: right_palm_link
        root_joint_name: right_tracking_wrist_free
        command_actuator_names:
          - right_finger1_joint1_actuator
          - right_finger1_joint2_actuator
          - right_finger1_joint3_actuator
          - right_finger1_joint4_actuator
          - right_finger2_joint1_actuator
          - right_finger2_joint2_actuator
          - right_finger2_joint3_actuator
          - right_finger2_joint4_actuator
          - right_finger3_joint1_actuator
          - right_finger3_joint2_actuator
          - right_finger3_joint3_actuator
          - right_finger3_joint4_actuator
          - right_finger4_joint1_actuator
          - right_finger4_joint2_actuator
          - right_finger4_joint3_actuator
          - right_finger4_joint4_actuator
          - right_finger5_joint1_actuator
          - right_finger5_joint2_actuator
          - right_finger5_joint3_actuator
          - right_finger5_joint4_actuator
        root_control: ${robot.native_scene.hands.0.root_control}
    objects:
      - entity_name: articulated_object
        root_body_name: object_0
        root_joint_name: object_0_free
        parts:
          - name: base
            body_name: object_0
            mesh_path: ${oc.env:FDR_NATIVE_BOX_BASE_MESH}
            body_from_mesh_position_m: [0.0, 0.0, 0.0]
            body_from_mesh_quat_wxyz: [1.0, 0.0, 0.0, 0.0]
            distance_sign: unsigned
          - name: lid
            body_name: object_0_articulated
            mesh_path: ${oc.env:FDR_NATIVE_BOX_LID_MESH}
            body_from_mesh_position_m: [0.0, 0.0, 0.0]
            body_from_mesh_quat_wxyz: [1.0, 0.0, 0.0, 0.0]
            distance_sign: unsigned
