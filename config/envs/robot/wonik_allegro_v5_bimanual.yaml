# @package _global_

# Native FREE-wrist producer configuration for wonik_allegro_v5.
# Strict physical anatomy only; missing fingers/roles remain absent.
robot:
  entity_name: robot
  self_collision: true
  xml_path: ${robot.native_scene.scene_xml_path}
  body_names:
    fingers: [thumb, index, middle, ring]
  joint_names:
    wrist_trans: []
    wrist_rot: []
    finger:
      - left_ctrl_joint_0_0
      - left_ctrl_joint_1_0
      - left_ctrl_joint_2_0
      - left_ctrl_joint_3_0
      - left_ctrl_joint_4_0
      - left_ctrl_joint_5_0
      - left_ctrl_joint_6_0
      - left_ctrl_joint_7_0
      - left_ctrl_joint_8_0
      - left_ctrl_joint_9_0
      - left_ctrl_joint_10_0
      - left_ctrl_joint_11_0
      - left_ctrl_joint_12_0
      - left_ctrl_joint_13_0
      - left_ctrl_joint_14_0
      - left_ctrl_joint_15_0
      - right_ctrl_joint_0_0
      - right_ctrl_joint_1_0
      - right_ctrl_joint_2_0
      - right_ctrl_joint_3_0
      - right_ctrl_joint_4_0
      - right_ctrl_joint_5_0
      - right_ctrl_joint_6_0
      - right_ctrl_joint_7_0
      - right_ctrl_joint_8_0
      - right_ctrl_joint_9_0
      - right_ctrl_joint_10_0
      - right_ctrl_joint_11_0
      - right_ctrl_joint_12_0
      - right_ctrl_joint_13_0
      - right_ctrl_joint_14_0
      - right_ctrl_joint_15_0
  site_names:
    tip:
      left: [left_link_15_0_tip, left_link_3_0_tip, left_link_7_0_tip, left_link_11_0_tip]
      right: [right_link_15_0_tip, right_link_3_0_tip, right_link_7_0_tip, right_link_11_0_tip]
    contact: ${robot.site_names.tip}
  contact_links:
    left: [left_world, left_link_0_0, left_link_1_0, left_link_2_0, left_link_3_0, left_link_4_0, left_link_5_0, left_link_6_0, left_link_7_0, left_link_8_0, left_link_9_0, left_link_10_0, left_link_11_0, left_link_12_0, left_link_13_0, left_link_14_0, left_link_15_0]
    right: [right_world, right_link_0_0, right_link_1_0, right_link_2_0, right_link_3_0, right_link_4_0, right_link_5_0, right_link_6_0, right_link_7_0, right_link_8_0, right_link_9_0, right_link_10_0, right_link_11_0, right_link_12_0, right_link_13_0, right_link_14_0, right_link_15_0]
  body_mapping:
    all:
      - [{left: left_link_14_0, right: right_link_14_0}, thumb_intermediate]
      - [{left: left_link_15_0, right: right_link_15_0}, thumb_distal]
      - [{left: left_link_1_0, right: right_link_1_0}, index_proximal]
      - [{left: left_link_2_0, right: right_link_2_0}, index_intermediate]
      - [{left: left_link_3_0, right: right_link_3_0}, index_distal]
      - [{left: left_link_5_0, right: right_link_5_0}, middle_proximal]
      - [{left: left_link_6_0, right: right_link_6_0}, middle_intermediate]
      - [{left: left_link_7_0, right: right_link_7_0}, middle_distal]
      - [{left: left_link_9_0, right: right_link_9_0}, ring_proximal]
      - [{left: left_link_10_0, right: right_link_10_0}, ring_intermediate]
      - [{left: left_link_11_0, right: right_link_11_0}, ring_distal]
    level1: {}
    level2: {}

  native_scene:
    scene_xml_path: ${oc.env:FDR_NATIVE_SCENE_XML}
    hands:
      - side: left
        entity_name: hand_left
        root_body_name: left_world
        root_joint_name: left_tracking_wrist_free
        command_actuator_names:
          - left_ctrl_joint_0_0
          - left_ctrl_joint_1_0
          - left_ctrl_joint_2_0
          - left_ctrl_joint_3_0
          - left_ctrl_joint_4_0
          - left_ctrl_joint_5_0
          - left_ctrl_joint_6_0
          - left_ctrl_joint_7_0
          - left_ctrl_joint_8_0
          - left_ctrl_joint_9_0
          - left_ctrl_joint_10_0
          - left_ctrl_joint_11_0
          - left_ctrl_joint_12_0
          - left_ctrl_joint_13_0
          - left_ctrl_joint_14_0
          - left_ctrl_joint_15_0
        root_control:
          position_stiffness: 360.0
          position_damping: 38.0
          rotation_stiffness: 360.0
          rotation_damping: 38.0
          force_limit_n: null
          torque_limit_nm: null
          gravity_compensation: 1.0
          gravity_world_m_per_s2: [0.0, 0.0, -9.81]
      - side: right
        entity_name: hand_right
        root_body_name: right_world
        root_joint_name: right_tracking_wrist_free
        command_actuator_names:
          - right_ctrl_joint_0_0
          - right_ctrl_joint_1_0
          - right_ctrl_joint_2_0
          - right_ctrl_joint_3_0
          - right_ctrl_joint_4_0
          - right_ctrl_joint_5_0
          - right_ctrl_joint_6_0
          - right_ctrl_joint_7_0
          - right_ctrl_joint_8_0
          - right_ctrl_joint_9_0
          - right_ctrl_joint_10_0
          - right_ctrl_joint_11_0
          - right_ctrl_joint_12_0
          - right_ctrl_joint_13_0
          - right_ctrl_joint_14_0
          - right_ctrl_joint_15_0
        root_control: ${robot.native_scene.hands.0.root_control}
    objects:
      - entity_name: articulated_object
        root_body_name: object_0
        root_joint_name: object_0_free
        parts:
          - name: base
            body_name: object_0
            mesh_path: ${oc.env:FDR_NATIVE_BOX_BASE_MESH}
            body_from_mesh_position_m: [0.0, 0.0, 0.0]
            body_from_mesh_quat_wxyz: [1.0, 0.0, 0.0, 0.0]
            distance_sign: unsigned
          - name: lid
            body_name: object_0_articulated
            mesh_path: ${oc.env:FDR_NATIVE_BOX_LID_MESH}
            body_from_mesh_position_m: [0.0, 0.0, 0.0]
            body_from_mesh_quat_wxyz: [1.0, 0.0, 0.0, 0.0]
            distance_sign: unsigned
