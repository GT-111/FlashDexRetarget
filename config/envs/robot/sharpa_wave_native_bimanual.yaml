# @package _global_

# Native FREE-wrist producer configuration for sharpa_wave.
# Strict physical anatomy only; missing fingers/roles remain absent.
robot:
  entity_name: robot
  self_collision: true
  xml_path: ${robot.native_scene.scene_xml_path}
  body_names:
    fingers: [thumb, index, middle, ring, pinky]
  joint_names:
    wrist_trans: []
    wrist_rot: []
    finger:
      - left_ctrl_thumb_CMC_FE
      - left_ctrl_thumb_CMC_AA
      - left_ctrl_thumb_MCP_FE
      - left_ctrl_thumb_MCP_AA
      - left_ctrl_thumb_IP
      - left_ctrl_index_MCP_FE
      - left_ctrl_index_MCP_AA
      - left_ctrl_index_PIP
      - left_ctrl_index_DIP
      - left_ctrl_middle_MCP_FE
      - left_ctrl_middle_MCP_AA
      - left_ctrl_middle_PIP
      - left_ctrl_middle_DIP
      - left_ctrl_ring_MCP_FE
      - left_ctrl_ring_MCP_AA
      - left_ctrl_ring_PIP
      - left_ctrl_ring_DIP
      - left_ctrl_pinky_CMC
      - left_ctrl_pinky_MCP_FE
      - left_ctrl_pinky_MCP_AA
      - left_ctrl_pinky_PIP
      - left_ctrl_pinky_DIP
      - right_ctrl_thumb_CMC_FE
      - right_ctrl_thumb_CMC_AA
      - right_ctrl_thumb_MCP_FE
      - right_ctrl_thumb_MCP_AA
      - right_ctrl_thumb_IP
      - right_ctrl_index_MCP_FE
      - right_ctrl_index_MCP_AA
      - right_ctrl_index_PIP
      - right_ctrl_index_DIP
      - right_ctrl_middle_MCP_FE
      - right_ctrl_middle_MCP_AA
      - right_ctrl_middle_PIP
      - right_ctrl_middle_DIP
      - right_ctrl_ring_MCP_FE
      - right_ctrl_ring_MCP_AA
      - right_ctrl_ring_PIP
      - right_ctrl_ring_DIP
      - right_ctrl_pinky_CMC
      - right_ctrl_pinky_MCP_FE
      - right_ctrl_pinky_MCP_AA
      - right_ctrl_pinky_PIP
      - right_ctrl_pinky_DIP
  site_names:
    tip:
      left: [left_thumb_fingertip, left_index_fingertip, left_middle_fingertip, left_ring_fingertip, left_pinky_fingertip]
      right: [right_thumb_fingertip, right_index_fingertip, right_middle_fingertip, right_ring_fingertip, right_pinky_fingertip]
    contact: ${robot.site_names.tip}
  contact_links:
    left: [left_hand_C_MC, left_thumb_CMC_VL, left_thumb_MC, left_thumb_MCP_VL, left_thumb_PP, left_thumb_DP, left_index_MCP_VL, left_index_PP, left_index_MP, left_index_DP, left_middle_MCP_VL, left_middle_PP, left_middle_MP, left_middle_DP, left_ring_MCP_VL, left_ring_PP, left_ring_MP, left_ring_DP, left_pinky_MC, left_pinky_MCP_VL, left_pinky_PP, left_pinky_MP, left_pinky_DP]
    right: [right_hand_C_MC, right_thumb_CMC_VL, right_thumb_MC, right_thumb_MCP_VL, right_thumb_PP, right_thumb_DP, right_index_MCP_VL, right_index_PP, right_index_MP, right_index_DP, right_middle_MCP_VL, right_middle_PP, right_middle_MP, right_middle_DP, right_ring_MCP_VL, right_ring_PP, right_ring_MP, right_ring_DP, right_pinky_MC, right_pinky_MCP_VL, right_pinky_PP, right_pinky_MP, right_pinky_DP]
  body_mapping:
    all:
      - [{left: left_thumb_PP, right: right_thumb_PP}, thumb_intermediate]
      - [{left: left_thumb_DP, right: right_thumb_DP}, thumb_distal]
      - [{left: left_index_PP, right: right_index_PP}, index_proximal]
      - [{left: left_index_MP, right: right_index_MP}, index_intermediate]
      - [{left: left_index_DP, right: right_index_DP}, index_distal]
      - [{left: left_middle_PP, right: right_middle_PP}, middle_proximal]
      - [{left: left_middle_MP, right: right_middle_MP}, middle_intermediate]
      - [{left: left_middle_DP, right: right_middle_DP}, middle_distal]
      - [{left: left_ring_PP, right: right_ring_PP}, ring_proximal]
      - [{left: left_ring_MP, right: right_ring_MP}, ring_intermediate]
      - [{left: left_ring_DP, right: right_ring_DP}, ring_distal]
      - [{left: left_pinky_PP, right: right_pinky_PP}, pinky_proximal]
      - [{left: left_pinky_MP, right: right_pinky_MP}, pinky_intermediate]
      - [{left: left_pinky_DP, right: right_pinky_DP}, pinky_distal]
    level1: {}
    level2: {}

  native_scene:
    scene_xml_path: ${oc.env:FDR_NATIVE_SCENE_XML}
    hands:
      - side: left
        entity_name: hand_left
        root_body_name: left_hand_C_MC
        root_joint_name: left_tracking_wrist_free
        command_actuator_names:
          - left_ctrl_thumb_CMC_FE
          - left_ctrl_thumb_CMC_AA
          - left_ctrl_thumb_MCP_FE
          - left_ctrl_thumb_MCP_AA
          - left_ctrl_thumb_IP
          - left_ctrl_index_MCP_FE
          - left_ctrl_index_MCP_AA
          - left_ctrl_index_PIP
          - left_ctrl_index_DIP
          - left_ctrl_middle_MCP_FE
          - left_ctrl_middle_MCP_AA
          - left_ctrl_middle_PIP
          - left_ctrl_middle_DIP
          - left_ctrl_ring_MCP_FE
          - left_ctrl_ring_MCP_AA
          - left_ctrl_ring_PIP
          - left_ctrl_ring_DIP
          - left_ctrl_pinky_CMC
          - left_ctrl_pinky_MCP_FE
          - left_ctrl_pinky_MCP_AA
          - left_ctrl_pinky_PIP
          - left_ctrl_pinky_DIP
        root_control:
          position_stiffness: 400.0
          position_damping: 40.0
          rotation_stiffness: 400.0
          rotation_damping: 40.0
          force_limit_n: null
          torque_limit_nm: null
          gravity_compensation: 1.0
          gravity_world_m_per_s2: [0.0, 0.0, -9.81]
      - side: right
        entity_name: hand_right
        root_body_name: right_hand_C_MC
        root_joint_name: right_tracking_wrist_free
        command_actuator_names:
          - right_ctrl_thumb_CMC_FE
          - right_ctrl_thumb_CMC_AA
          - right_ctrl_thumb_MCP_FE
          - right_ctrl_thumb_MCP_AA
          - right_ctrl_thumb_IP
          - right_ctrl_index_MCP_FE
          - right_ctrl_index_MCP_AA
          - right_ctrl_index_PIP
          - right_ctrl_index_DIP
          - right_ctrl_middle_MCP_FE
          - right_ctrl_middle_MCP_AA
          - right_ctrl_middle_PIP
          - right_ctrl_middle_DIP
          - right_ctrl_ring_MCP_FE
          - right_ctrl_ring_MCP_AA
          - right_ctrl_ring_PIP
          - right_ctrl_ring_DIP
          - right_ctrl_pinky_CMC
          - right_ctrl_pinky_MCP_FE
          - right_ctrl_pinky_MCP_AA
          - right_ctrl_pinky_PIP
          - right_ctrl_pinky_DIP
        root_control: ${robot.native_scene.hands.0.root_control}
    objects:
      - entity_name: articulated_object
        root_body_name: object_0
        root_joint_name: object_0_free
        parts:
          - name: base
            body_name: object_0
            mesh_path: ${oc.env:FDR_NATIVE_BOX_BASE_MESH}
            body_from_mesh_position_m: [0.0, 0.0, 0.0]
            body_from_mesh_quat_wxyz: [1.0, 0.0, 0.0, 0.0]
            distance_sign: unsigned
          - name: lid
            body_name: object_0_articulated
            mesh_path: ${oc.env:FDR_NATIVE_BOX_LID_MESH}
            body_from_mesh_position_m: [0.0, 0.0, 0.0]
            body_from_mesh_quat_wxyz: [1.0, 0.0, 0.0, 0.0]
            distance_sign: unsigned
